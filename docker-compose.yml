x-service-build: &service-build
  context: .
  dockerfile: Dockerfile
  target: service

x-node: &node
  env_file: .env
  restart: unless-stopped
  environment: &service-env
    TZ: Asia/Ho_Chi_Minh
    DB_HOST: postgres
    DB_PORT: "5432"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    AUTH_SERVICE_URL: http://auth-service:3001
    PATIENT_SERVICE_URL: http://patient-service:3002
    STAFF_SERVICE_URL: http://staff-service:3003
    APPOINTMENT_SERVICE_URL: http://appointment-service:3004
    MEDICAL_RECORD_SERVICE_URL: http://medical-record-service:3010
    PHARMACY_SERVICE_URL: http://pharmacy-service:3011
    BILLING_SERVICE_URL: http://billing-service:3012
    NOTIFICATION_SERVICE_URL: http://notification-service:3013
    AUTH_PORT: "3001"
    PATIENT_PORT: "3002"
    STAFF_PORT: "3003"
    APPOINTMENT_PORT: "3004"
    MEDICAL_RECORD_PORT: "3010"
    PHARMACY_PORT: "3011"
    BILLING_PORT: "3012"
    NOTIFICATION_PORT: "3013"
    GATEWAY_PORT: "3000"

services:
  postgres:
    image: postgres:15
    container_name: qlpk-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-qlphongkham}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      - "5433:5432"
    volumes:
      - qlpk_pg:/var/lib/postgresql/data
      - ./database/qlphongkham.sql:/docker-entrypoint-initdb.d/01-qlphongkham.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-qlphongkham}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: qlpk-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-migrate:
    image: postgres:15
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-postgres}
      PGDATABASE: ${DB_NAME:-qlphongkham}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./database/migrations:/migrations:ro
      - ./database/run-migrations.sh:/usr/local/bin/run-migrations.sh:ro
      - ./database/backups:/backups
    entrypoint: ["bash", "/usr/local/bin/run-migrations.sh"]
    restart: "no"

  auth-service:
    <<: *node
    image: qlpk-auth:local
    build:
      <<: *service-build
      args:
        SERVICE_PKG: "@qlpk/auth-service"
        SERVICE_DIR: services/auth-service
    container_name: qlpk-auth
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck: &node-health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.AUTH_PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

  patient-service:
    <<: *node
    image: qlpk-patient:local
    build:
      <<: *service-build
      args:
        SERVICE_PKG: "@qlpk/patient-service"
        SERVICE_DIR: services/patient-service
    container_name: qlpk-patient
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *node-health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PATIENT_PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  staff-service:
    <<: *node
    image: qlpk-staff:local
    build:
      <<: *service-build
      args:
        SERVICE_PKG: "@qlpk/staff-service"
        SERVICE_DIR: services/staff-service
    container_name: qlpk-staff
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *node-health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.STAFF_PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  appointment-service:
    <<: *node
    image: qlpk-appointment:local
    build:
      <<: *service-build
      args:
        SERVICE_PKG: "@qlpk/appointment-service"
        SERVICE_DIR: services/appointment-service
    container_name: qlpk-appointment
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      <<: *node-health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.APPOINTMENT_PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  medical-record-service:
    <<: *node
    image: qlpk-medical-record:local
    build:
      <<: *service-build
      args:
        SERVICE_PKG: "@qlpk/medical-record-service"
        SERVICE_DIR: services/medical-record-service
    container_name: qlpk-medical-record
    ports:
      - "3010:3010"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *node-health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.MEDICAL_RECORD_PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  billing-service:
    <<: *node
    image: qlpk-billing:local
    build:
      <<: *service-build
      args:
        SERVICE_PKG: "@qlpk/billing-service"
        SERVICE_DIR: services/billing-service
    container_name: qlpk-billing
    ports:
      - "3012:3012"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *node-health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.BILLING_PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  pharmacy-service:
    <<: *node
    image: qlpk-pharmacy:local
    build:
      <<: *service-build
      args:
        SERVICE_PKG: "@qlpk/pharmacy-service"
        SERVICE_DIR: services/pharmacy-service
    container_name: qlpk-pharmacy
    ports:
      - "3011:3011"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *node-health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.PHARMACY_PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  notification-service:
    <<: *node
    image: qlpk-notification:local
    build:
      <<: *service-build
      args:
        SERVICE_PKG: "@qlpk/notification-service"
        SERVICE_DIR: services/notification-service
    container_name: qlpk-notification
    ports:
      - "3013:3013"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *node-health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.NOTIFICATION_PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  api-gateway:
    <<: *node
    image: qlpk-gateway:local
    build:
      <<: *service-build
      args:
        SERVICE_PKG: "@qlpk/api-gateway"
        SERVICE_DIR: services/api-gateway
    container_name: qlpk-gateway
    ports:
      - "3000:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      patient-service:
        condition: service_healthy
      staff-service:
        condition: service_healthy
      appointment-service:
        condition: service_healthy
      medical-record-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      pharmacy-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      <<: *node-health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.GATEWAY_PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  frontend:
    image: qlpk-frontend:local
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: qlpk-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  qlpk_pg:
